claim_reconciliation:
  bone_analogy:
    supplied_claim: Cancellous bone is acoustic foam capturing a frozen wave state.
    disposition: ANALOGY_ONLY_ORIGIN_HYPOTHESIS_UNESTABLISHED
    retained_principle: Structure can adapt under bounded mechanical conditions.
    qualification: >-
      Porous geometry alone does not establish an acoustic origin. The cited bone
      study models cellular remodeling coupled to mechanical load transfer.
    source: SRC_BONE_01
  supplied_srf_equation:
    expression: dR/dt = div(K grad(R)) + Omega(Lambda,Sigma) - eta*R
    usual_interpretation: DIFFUSION_FORCING_AND_DECAY
    qualification: >-
      This equation does not establish acoustic propagation or resonance as supplied.
      R, K, Omega, Lambda, Sigma, and eta require types, units, and constitutive definitions.
      No universal convergence or stability claim is made for an unspecified Omega.
    role_if_retained: SEPARATELY_SPECIFIED_RELAXATION_OR_GENERATIVE_MODEL
  numerical_relaxation:
    qualification: >-
      Numerical residual convergence is distinct from physical elapsed time,
      curing, phase change, and persistent material structure. A relaxation
      subsolver may be useful within a separately declared physical solver.
  bmims_mapping:
    supplied_label: Layer 1 BMIMS Semantic Language Solidified Matrix
    disposition: PROPOSED_INTERFACE_MAPPING_REQUIRING_RECONCILIATION
    preserved_identity: Computational membrane and habitat identity.
    preserved_scoped_role: Perceptual-conformance witness and Predicate Lens.
    qualification: >-
      Geometry extraction does not redefine BMIMS or establish semantic truth,
      source relationships, admission, or action authority. A new interface
      contract must preserve source identity, evidence, uncertainty, version,
      and jurisdiction before this mapping is used operationally.
  metabolic_bound:
    supplied_expression: W_u > E_m
    disposition: UNRESOLVED_DEFINITIONS_AND_UNITS
    qualification: >-
      Utility cannot be compared directly to joules without a declared mapping.
      A work-energy comparison does not independently establish entropy reduction.
      Structural benefit, compute cost, and any defined entropy measure remain separate.

candidate_physical_model:
  pressure_wave:
    expression: d2p/dt2 + 2*gamma*dp/dt = c^2*laplacian(p) + s(x,t)
    standing: PROPOSED_STARTING_APPROXIMATION
    assumptions:
      - homogeneous stationary medium
      - small-amplitude linear acoustic regime
      - phenomenological nonnegative damping
    variables:
      p: {meaning: acoustic_pressure, unit: Pa}
      t: {meaning: physical_time, unit: s}
      x: {meaning: spatial_position, unit: m}
      c: {meaning: sound_speed, unit: m/s}
      gamma: {meaning: damping_rate, unit: 1/s}
      s: {meaning: pressure_equation_source, unit: Pa/s^2}
    extensions_required: >-
      Heterogeneous density, sound speed, boundary impedance, streaming, and
      nonlinear regimes require separately declared models and benchmarks.
    steady_response: Sustained harmonic forcing may settle to a periodic response.
    source: SRC_ACOUSTICS_01
  energy_accounting:
    obligation: Account for input, stored energy, dissipation, and net boundary transport.
    qualification: Constant field energy is not required in a driven dissipative domain.
    unforced_passive_case: Stored energy should not increase beyond the pinned numerical tolerance.
  mass_accounting:
    obligation: Declare material mass, open-boundary fluxes, and losses when material transport is modeled.
    qualification: Resonance amplitude is not automatically a material-mass variable.
  material_response:
    status: UNSPECIFIED
    required_mechanisms:
      - time-averaged acoustic radiation force where its approximation is valid
      - independently modeled or measured streaming
      - particle motion and boundary interactions
      - local crowding and contacts where relevant
      - separately characterized stabilization for a persistent-object claim

