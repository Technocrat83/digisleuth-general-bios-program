benchmark_battery:
  standing: PROPOSED_UNEXECUTED_NOT_FROZEN_PREREGISTRATION
  numerical_acceptance_thresholds: UNPINNED
  fixtures:
    - id: MPE_B01_KNOWN_CAVITY_MODE
      requirement: Compare frequency, phase, and spatial pattern with a declared analytical reference.
      failure_target: Incorrect wave mechanics or numerical dispersion.
    - id: MPE_B02_DRIVE_REMOVED
      requirement: Compare stored-energy decay with declared passive losses and numerical tolerance.
      failure_target: Numerical energy injection or incorrect damping.
    - id: MPE_B03_BOUNDARY_CHANGED
      requirement: Verify predicted differences between specified reflecting and absorbing boundaries.
      failure_target: Boundary settings that do not implement the declared physical response.
    - id: MPE_B04_DISCRETIZATION_REFINEMENT
      requirement: Measure field and geometry convergence under mesh and time-step refinement.
      failure_target: Morphology produced by discretization artifacts.
    - id: MPE_B05_EXTRACTION_SENSITIVITY
      requirement: Report sensitivity to the declared threshold and connectivity rules.
      failure_target: An extraction-imposed shape incorrectly attributed to physical dynamics.
  outcome_rules:
    PASS: Sufficient evidence meets the criteria pinned before confirmatory execution.
    FAIL: Sufficient evidence demonstrates violation of a pinned criterion.
    UNRESOLVED: Required criteria, calibration, implementation, or observations are missing.
  current_outcome: UNRESOLVED_NO_EXECUTION_EVIDENCE

