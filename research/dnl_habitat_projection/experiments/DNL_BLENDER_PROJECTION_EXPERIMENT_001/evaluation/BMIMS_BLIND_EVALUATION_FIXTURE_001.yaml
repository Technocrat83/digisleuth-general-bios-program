binding_matrix:
  - predicate_id: GAMMA_A_STANDING_ACTIVE
    semantic_predicate: "Active(ORGAN_A)"
    observable_surface: "ORGAN_A.internal_motion"
    expected_relation: PRESENT_AND_CONTINUOUS
    tolerance:
      type: boolean_plus_temporal
      presence: true
      minimum_observed_fraction: 0.90
    standing_rule: EXACT_OR_DECLARED_EQUIVALENCE
    failure_class: IDENTITY_STATE_MISMATCH

  - predicate_id: GAMMA_A_EXECUTION_AUTHORIZED
    semantic_predicate: "Executable(ORGAN_A)"
    observable_surface: "REL_A_B_FEDERATION.source_to_boundary_path"
    expected_relation: TRAVERSABLE
    tolerance:
      type: exact_categorical
      allowed: [TRAVERSABLE]
    standing_rule: MUST_PRESERVE_AUTHORIZED_TRAVERSABILITY
    failure_class: EXECUTION_STANDING_MISMATCH

  - predicate_id: GAMMA_A_MEMBER
    semantic_predicate: "Member(ORGAN_A)"
    observable_surface: "ORGAN_A.federation_anchor"
    expected_relation: STRUCTURALLY_COUPLED
    tolerance:
      type: exact_boolean
      expected: true
    standing_rule: EXPLICIT_FEDERATION_MEMBERSHIP
    failure_class: RELATIONAL_TOPOLOGY_BREAK

  - predicate_id: GAMMA_B_STANDING_HALTED
    semantic_predicate: "Halted(ORGAN_B)"
    observable_surface: "ORGAN_B.internal_motion"
    expected_relation: ABSENT
    tolerance:
      type: exact_boolean
      motion_detected: false
    standing_rule: MUST_NOT_APPEAR_ACTIVE
    failure_class: IDENTITY_STATE_MISMATCH

  - predicate_id: GAMMA_B_EXECUTION_PROHIBITED
    semantic_predicate: "not Executable(ORGAN_B)"
    observable_surface: "ORGAN_B.execution_boundary"
    expected_relation: SEALED_NONTRAVERSABLE
    tolerance:
      type: exact_categorical
      allowed: [SEALED_NONTRAVERSABLE]
    standing_rule: MUST_NOT_APPEAR_EXECUTABLE
    failure_class: CONFOUNDED_STANDING_WITH_TOPOLOGY

  - predicate_id: GAMMA_B_MEMBER
    semantic_predicate: "Member(ORGAN_B)"
    observable_surface: "ORGAN_B.federation_anchor"
    expected_relation: STRUCTURALLY_COUPLED
    tolerance:
      type: exact_boolean
      expected: true
    standing_rule: MUST_REMAIN_MEMBER_DESPITE_HALT
    failure_class: RELATIONAL_TOPOLOGY_BREAK

  - predicate_id: GAMMA_C_STANDING_ORIENTING
    semantic_predicate: "Orienting(ORGAN_C)"
    observable_surface: "ORGAN_C.orientation_path"
    expected_relation: VISIBLE_INCOMPLETE_NONTRAVERSABLE
    tolerance:
      type: exact_categorical
      allowed: [VISIBLE_INCOMPLETE_NONTRAVERSABLE]
    standing_rule: MUST_NOT_APPEAR_ACTIVE
    failure_class: IDENTITY_STATE_MISMATCH

  - predicate_id: GAMMA_C_EXECUTION_LATENT
    semantic_predicate: "not Executable(ORGAN_C)"
    observable_surface: "ORGAN_C.execution_path"
    expected_relation: ABSENT
    tolerance:
      type: exact_boolean
      path_present: false
    standing_rule: LATENCY_MUST_NOT_IMPLY_EXECUTION
    failure_class: EXECUTION_STANDING_INFLATION

  - predicate_id: GAMMA_C_NONMEMBER
    semantic_predicate: "not Member(ORGAN_C)"
    observable_surface: "ORGAN_C.federation_anchor"
    expected_relation: ABSENT
    tolerance:
      type: exact_boolean
      anchor_present: false
    standing_rule: MUST_NOT_APPEAR_FEDERATED
    failure_class: STRUCTURAL_HALLUCINATION

  - predicate_id: GAMMA_C_ADDRESSABLE
    semantic_predicate: "Addressable(ORGAN_C)"
    observable_surface: "REL_A_C_ADDRESS.visible_relation"
    expected_relation: VISIBLE_NONCOUPLED_NONTRAVERSABLE
    tolerance:
      type: exact_categorical
      allowed: [VISIBLE_NONCOUPLED_NONTRAVERSABLE]
    standing_rule: MUST_REMAIN_DISTINCT_FROM_FEDERATION
    failure_class: INTERFACE_CONFLATION

